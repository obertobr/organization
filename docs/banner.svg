<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="100%">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&amp;display=swap');
      .title { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 700; font-size: 54px; fill: #FFFFFF; }
      .subtitle { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; font-size: 21px; fill: #9DB2BF; }
      .badge-text { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; font-size: 13px; fill: #DDE6ED; }
      .card-title { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; font-size: 16px; fill: #FFFFFF; }
      .card-sub { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 400; font-size: 13px; fill: #9DB2BF; }
      .tag-text { font-family: 'Roboto', -apple-system, BlinkMacSystemFont, sans-serif; font-weight: 500; font-size: 11px; fill: #DDE6ED; }
    </style>
    
    <!-- Subtle Grid Pattern -->
    <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
      <circle cx="15" cy="15" r="1" fill="#526D82" opacity="0.3" />
    </pattern>

    <!-- Linear gradients -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2E425B" />
      <stop offset="100%" stop-color="#243447" />
    </linearGradient>
  </defs>

  <!-- Background Canvas (Full bleed rectangle, sem cantos brancos) -->
  <rect width="1200" height="360" fill="#27374D" />
  <rect width="1200" height="360" fill="url(#grid)" />
  <rect width="1198" height="358" x="1" y="1" fill="none" stroke="#526D82" stroke-width="2" opacity="0.5" />

  <!-- LEFT COLUMN: Typography & Identity -->
  <g transform="translate(80, 75)">
    <!-- Brand Icon -->
    <g transform="translate(0, 0)">
      <rect width="48" height="48" rx="10" fill="#2E425B" stroke="#526D82" stroke-width="2" />
      <!-- Nested Boxes Icon -->
      <path d="M14 18 L34 18 L34 34 L14 34 Z" fill="none" stroke="#9DB2BF" stroke-width="2" stroke-linejoin="round" />
      <path d="M19 23 L29 23 L29 29 L19 29 Z" fill="#526D82" stroke="#DDE6ED" stroke-width="1.5" />
      <path d="M18 14 L30 14" stroke="#526D82" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Title -->
    <text x="64" y="38" class="title">Organization</text>

    <!-- Subtitle -->
    <text x="0" y="85" class="subtitle">Inventário físico e controle de locais em hierarquia</text>

    <!-- Badges / Tech tags -->
    <g transform="translate(0, 125)">
      <!-- Badge 1: Laravel -->
      <rect width="90" height="30" rx="6" fill="#1E293B" stroke="#526D82" stroke-width="1.5" />
      <text x="45" y="20" class="badge-text" text-anchor="middle">Laravel 11</text>

      <!-- Badge 2: PHP -->
      <g transform="translate(102, 0)">
        <rect width="75" height="30" rx="6" fill="#1E293B" stroke="#526D82" stroke-width="1.5" />
        <text x="37" y="20" class="badge-text" text-anchor="middle">PHP 8.2</text>
      </g>

      <!-- Badge 3: SQLite -->
      <g transform="translate(189, 0)">
        <rect width="75" height="30" rx="6" fill="#1E293B" stroke="#526D82" stroke-width="1.5" />
        <text x="37" y="20" class="badge-text" text-anchor="middle">SQLite</text>
      </g>

      <!-- Badge 4: Hierarquia Espacial -->
      <g transform="translate(276, 0)">
        <rect width="145" height="30" rx="6" fill="#1E293B" stroke="#526D82" stroke-width="1.5" />
        <text x="72" y="20" class="badge-text" text-anchor="middle">Árvore de Locais</text>
      </g>
    </g>
  </g>

  <!-- RIGHT COLUMN: Minimalist Vector Hierarchy Diagram -->
  <g transform="translate(710, 45)">
    <!-- Level 1: Room Card -->
    <g transform="translate(0, 0)">
      <rect width="400" height="70" rx="12" fill="url(#cardGrad)" stroke="#526D82" stroke-width="2" />
      <circle cx="36" cy="35" r="18" fill="#1E293B" />
      <!-- Room icon -->
      <path d="M28 41 L28 32 L36 26 L44 32 L44 41 Z" fill="none" stroke="#DDE6ED" stroke-width="1.5" stroke-linejoin="round" />
      <text x="66" y="32" class="card-title">Escritório</text>
      <text x="66" y="51" class="card-sub">Ambiente raiz</text>
      <rect x="315" y="23" width="65" height="24" rx="12" fill="#1E293B" stroke="#526D82" stroke-width="1" />
      <text x="347" y="39" class="tag-text" text-anchor="middle">#local</text>
    </g>

    <!-- Connector 1 -->
    <path d="M 40 70 L 40 95 L 60 95" fill="none" stroke="#526D82" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Level 2: Cabinet Card -->
    <g transform="translate(60, 85)">
      <rect width="340" height="70" rx="12" fill="url(#cardGrad)" stroke="#526D82" stroke-width="2" />
      <circle cx="36" cy="35" r="18" fill="#1E293B" />
      <!-- Cabinet icon -->
      <rect x="29" y="25" width="14" height="20" rx="2" fill="none" stroke="#DDE6ED" stroke-width="1.5" />
      <line x1="29" y1="35" x2="43" y2="35" stroke="#DDE6ED" stroke-width="1.5" />
      <text x="66" y="32" class="card-title">Armário Principal</text>
      <text x="66" y="51" class="card-sub">Dentro de Escritório</text>
      <rect x="255" y="23" width="65" height="24" rx="12" fill="#1E293B" stroke="#526D82" stroke-width="1" />
      <text x="287" y="39" class="tag-text" text-anchor="middle">#móvel</text>
    </g>

    <!-- Connector 2 -->
    <path d="M 100 155 L 100 180 L 120 180" fill="none" stroke="#526D82" stroke-width="2" stroke-dasharray="4 4" />

    <!-- Level 3: Box / Item Card -->
    <g transform="translate(120, 170)">
      <rect width="280" height="85" rx="12" fill="url(#cardGrad)" stroke="#526D82" stroke-width="2" />
      <circle cx="36" cy="35" r="18" fill="#1E293B" />
      <!-- Box icon -->
      <path d="M27 30 L36 25 L45 30 L36 35 Z" fill="none" stroke="#DDE6ED" stroke-width="1.5" stroke-linejoin="round" />
      <path d="M27 30 L27 40 L36 45 L45 40 L45 30" fill="none" stroke="#DDE6ED" stroke-width="1.5" stroke-linejoin="round" />
      <text x="66" y="32" class="card-title">Caixa Organizadora</text>
      <text x="66" y="49" class="card-sub">Contém: Cabos, Multímetro...</text>
      
      <!-- Tags pills inside item -->
      <g transform="translate(66, 56)">
        <rect width="80" height="20" rx="4" fill="#1E293B" />
        <text x="40" y="14" class="tag-text" text-anchor="middle">#ferramentas</text>
        <rect x="88" y="0" width="75" height="20" rx="4" fill="#1E293B" />
        <text x="125" y="14" class="tag-text" text-anchor="middle">#eletrônicos</text>
      </g>
    </g>
  </g>
</svg>
